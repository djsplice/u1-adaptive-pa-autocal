######################################################################
# Adaptive PA coil multi-point helpers (U1) — MACROS ONLY
#
# No Klipper Python changes. Stock FLOW_MEASURE_K / FLOW_CALIBRATE.
# After each measure, run APA_FINISH_CELL with the sign-flip k/area pair.
#
# Geometry (0.4 n / 0.2 lh / 0.45 w / 1.75 fil):
#   A_line=0.081416  ratio=0.033851  Q = v_XY * A_line
#
# Default envelope (U1/Orca-ish 0.2 mm):
#   speeds 100 / 200 / 250
#   accels 2000 / 6000 / 10000  (HQ outer -> inner)
#
# Workflow:
#   APA_COIL_SHOW_ENVELOPE
#   APA_COIL_RUN_ALL EXTRUDER=0 MODE=MEASURE TEMP=220
#   APA_FINISH_LAST K0=.. A0=.. K1=.. A1=.. MAX_ABS=..
#
# Cost (defaults): ~5 min and a few grams per test point;
#   full suite ~25 min and ~20 g PLA per tool.
#
# [include adaptive_pa_macro.cfg]
# No digits mid-name (Klipper G-code parser).
######################################################################

[gcode_macro _APA_COIL_CFG]
description: Geometry + speed/accel envelope for APA coil multi-point calibration
variable_line_area: 0.081416
variable_fil_area: 2.405157
variable_ratio: 0.033851
variable_temp: 220
variable_k_min: 0.005
variable_k_max: 0.040
variable_k_step: 0.005
variable_loop: 14
variable_slow_frac: 0.75
variable_low_speed: 100.0
variable_mid_speed: 200.0
variable_high_speed: 250.0
variable_low_accel: 2000.0
variable_mid_accel: 6000.0
variable_high_accel: 10000.0
variable_last_k_star: 0.0
# Last measured test point (for short APA_FINISH_CELL / APA_FINISH_LAST)
variable_pending_valid: 0
variable_pending_name: "none"
variable_pending_flow: 0.0
variable_pending_accel: 0.0
variable_pending_speed: 0.0
variable_pending_mode: "MEASURE"
gcode:
    APA_COIL_SHOW_ENVELOPE

[gcode_macro APA_COIL_SHOW_ENVELOPE]
description: Print current geometry + speed/accel envelope and Q for each test point
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {% set q_lo = c.low_speed * c.line_area %}
    {% set q_mid = c.mid_speed * c.line_area %}
    {% set q_hi = c.high_speed * c.line_area %}
    {action_respond_info("========== APA ENVELOPE ==========")}
    {action_respond_info("Geometry: A_line=" ~ c.line_area ~ "  ratio=" ~ c.ratio ~ "  (Q = v_XY * A_line)")}
    {action_respond_info("Speeds mm/s:  low=" ~ c.low_speed ~ "  mid=" ~ c.mid_speed ~ "  high=" ~ c.high_speed)}
    {action_respond_info("Accels:       low=" ~ c.low_accel ~ "  mid=" ~ c.mid_accel ~ "  high=" ~ c.high_accel)}
    {action_respond_info("Q mm3/s:      low=" ~ q_lo ~ "  mid=" ~ q_mid ~ "  high=" ~ q_hi)}
    {action_respond_info("Test points:")}
    {action_respond_info("  low_anchor  SPEED=" ~ c.low_speed ~ " ACCEL=" ~ c.low_accel ~ "  FLOW=" ~ q_lo)}
    {action_respond_info("  high_flow   SPEED=" ~ c.high_speed ~ " ACCEL=" ~ c.low_accel ~ "  FLOW=" ~ q_hi)}
    {action_respond_info("  high_force  SPEED=" ~ c.low_speed ~ " ACCEL=" ~ c.high_accel ~ "  FLOW=" ~ q_lo)}
    {action_respond_info("  stress      SPEED=" ~ c.high_speed ~ " ACCEL=" ~ c.high_accel ~ "  FLOW=" ~ q_hi)}
    {action_respond_info("  center      SPEED=" ~ c.mid_speed ~ " ACCEL=" ~ c.mid_accel ~ "  FLOW=" ~ q_mid)}
    {action_respond_info("Tune: APA_COIL_SET_ENVELOPE LOW_SPEED= HIGH_SPEED= LOW_ACCEL= HIGH_ACCEL=")}
    {action_respond_info("Presets: U1_DEFAULT | ORCA_NORMAL | SHAPER_QUALITY | HIGH_FLOW")}
    {action_respond_info("==================================")}

[gcode_macro APA_COIL_SET_ENVELOPE]
description: Set XY speed/accel envelope (and optional geometry). Omitting a param keeps current value.
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {% set low_s = params.LOW_SPEED|default(c.low_speed)|float %}
    {% set high_s = params.HIGH_SPEED|default(c.high_speed)|float %}
    {% set low_a = params.LOW_ACCEL|default(c.low_accel)|float %}
    {% set high_a = params.HIGH_ACCEL|default(c.high_accel)|float %}
    {% set mid_s_default = (low_s + high_s) / 2.0 %}
    {% set mid_a_default = (low_a + high_a) / 2.0 %}
    {% set mid_s = params.MID_SPEED|default(mid_s_default)|float %}
    {% set mid_a = params.MID_ACCEL|default(mid_a_default)|float %}
    {% set line_area = params.LINE_AREA|default(c.line_area)|float %}
    {% set ratio = params.RATIO|default(c.ratio)|float %}
    {% if low_s <= 0 or high_s <= 0 or low_s >= high_s %}
        {action_raise_error("Need 0 < LOW_SPEED < HIGH_SPEED")}
    {% endif %}
    {% if low_a <= 0 or high_a <= 0 %}
        {action_raise_error("LOW_ACCEL and HIGH_ACCEL must be > 0")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=low_speed VALUE={low_s}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=mid_speed VALUE={mid_s}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=high_speed VALUE={high_s}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=low_accel VALUE={low_a}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=mid_accel VALUE={mid_a}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=high_accel VALUE={high_a}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=line_area VALUE={line_area}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=ratio VALUE={ratio}
    {action_respond_info("APA envelope updated.")}
    APA_COIL_SHOW_ENVELOPE

[gcode_macro APA_COIL_PRESET_U1_DEFAULT]
description: U1/Orca-like defaults (100-250 mm/s, 2k-10k accel)
gcode:
    APA_COIL_SET_ENVELOPE LOW_SPEED=100 HIGH_SPEED=250 MID_SPEED=200 LOW_ACCEL=2000 HIGH_ACCEL=10000 MID_ACCEL=6000

[gcode_macro APA_COIL_PRESET_ORCA_NORMAL]
description: Normal outer ~4k to inner 10k; same default speeds
gcode:
    APA_COIL_SET_ENVELOPE LOW_SPEED=100 HIGH_SPEED=250 MID_SPEED=200 LOW_ACCEL=4000 HIGH_ACCEL=10000 MID_ACCEL=7000

[gcode_macro APA_COIL_PRESET_SHAPER_QUALITY]
description: Flow-only: single accel (default 2000). Optional ACCEL=
gcode:
    {% set a = 2000.0 %}
    {% if params.ACCEL is defined %}
        {% set a = params.ACCEL|float %}
    {% elif params.HIGH_ACCEL is defined %}
        {% set a = params.HIGH_ACCEL|float %}
    {% endif %}
    APA_COIL_SET_ENVELOPE LOW_SPEED=100 HIGH_SPEED=250 MID_SPEED=200 LOW_ACCEL={a} HIGH_ACCEL={a} MID_ACCEL={a}
    {action_respond_info("Quality single-accel preset: accel=" ~ a ~ " (flow-only APA grid)")}

[gcode_macro APA_COIL_PRESET_HIGH_FLOW]
description: Wider speed for high-MVS nozzles. Optional LOW_SPEED HIGH_SPEED LOW_ACCEL HIGH_ACCEL
gcode:
    {% set ls = 150.0 %}
    {% set hs = 300.0 %}
    {% set ms = 225.0 %}
    {% set la = 2000.0 %}
    {% set ha = 10000.0 %}
    {% if params.LOW_SPEED is defined %}
        {% set ls = params.LOW_SPEED|float %}
    {% endif %}
    {% if params.HIGH_SPEED is defined %}
        {% set hs = params.HIGH_SPEED|float %}
    {% endif %}
    {% if params.MID_SPEED is defined %}
        {% set ms = params.MID_SPEED|float %}
    {% else %}
        {% set ms = (ls + hs) / 2.0 %}
    {% endif %}
    {% if params.LOW_ACCEL is defined %}
        {% set la = params.LOW_ACCEL|float %}
    {% endif %}
    {% if params.HIGH_ACCEL is defined %}
        {% set ha = params.HIGH_ACCEL|float %}
    {% endif %}
    {% set mid_a = (la + ha) / 2.0 %}
    APA_COIL_SET_ENVELOPE LOW_SPEED={ls} HIGH_SPEED={hs} MID_SPEED={ms} LOW_ACCEL={la} HIGH_ACCEL={ha} MID_ACCEL={mid_a}
    {action_respond_info("High-flow preset: cap HIGH_SPEED by filament MVS (v = Q_mvs / A_line).")}

[gcode_macro APA_SELECT_TOOL]
description: Dock/pick U1 tool 0-3 (T0..T3 A0). Verifies in a follow-up command (status is only valid after T runs).
gcode:
    {% set e = params.EXTRUDER|default(0)|int %}
    {% if e < 0 or e > 3 %}
        {action_raise_error("EXTRUDER must be 0..3")}
    {% endif %}
    {% if e == 0 %}
        {% set want = "extruder" %}
    {% else %}
        {% set want = "extruder" ~ e %}
    {% endif %}
    {action_respond_info("APA: selecting tool " ~ e ~ " (" ~ want ~ ")")}
    T{e} A0
    M400
    APA_SELECT_TOOL_VERIFY WANT={want} INDEX={e}

[gcode_macro APA_SELECT_TOOL_VERIFY]
description: Internal - verify active extruder after tool change has executed
gcode:
    {% set want = params.WANT|string %}
    {% set e = params.INDEX|default(-1)|int %}
    {% set got = printer.toolhead.extruder %}
    {% if got != want %}
        {action_raise_error("Expected active extruder " ~ want ~ ", got " ~ got ~ " (tool change may have failed)")}
    {% endif %}
    {action_respond_info("APA: active extruder " ~ got ~ " (index " ~ e ~ ")")}

######################################################################
# Post-process
######################################################################

[gcode_macro APA_FINISH_CELL]
description: Interp K* from K0/A0/K1/A1. FLOW/ACCEL/NAME optional if a test point just finished (uses last pending). Or use APA_FINISH_LAST.
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {% set k0 = params.K0|float %}
    {% set a0 = params.A0|float %}
    {% set k1 = params.K1|float %}
    {% set a1 = params.A1|float %}
    {% set max_abs = params.MAX_ABS|default(0)|float %}
    {% if params.FLOW is defined %}
        {% set flow = params.FLOW|float %}
    {% elif c.pending_valid %}
        {% set flow = c.pending_flow %}
    {% else %}
        {action_raise_error("FLOW= required (or run a test point first so pending FLOW is set)")}
    {% endif %}
    {% if params.ACCEL is defined %}
        {% set accel = params.ACCEL|float %}
    {% elif c.pending_valid %}
        {% set accel = c.pending_accel %}
    {% else %}
        {action_raise_error("ACCEL= required (or run a test point first)")}
    {% endif %}
    {% if params.NAME is defined %}
        {% set name = params.NAME|string %}
    {% elif c.pending_valid %}
        {% set name = c.pending_name %}
    {% else %}
        {% set name = "point" %}
    {% endif %}

    {% if k1 == k0 %}
        {action_raise_error("K0 and K1 must differ")}
    {% endif %}

    {% if a0 == 0 %}
        {% set k_star = k0 %}
    {% elif a1 == 0 %}
        {% set k_star = k1 %}
    {% elif (a0 * a1) > 0 %}
        {action_raise_error("A0 and A1 same sign - pick k steps that straddle zero")}
    {% else %}
        {% set k_star = k0 - a0 * (k1 - k0) / (a1 - a0) %}
    {% endif %}

    {% set k_out = ((k_star * 1000.0)|round) / 1000.0 %}

    {% if a0 >= 0 %}
        {% set abs0 = a0 %}
    {% else %}
        {% set abs0 = 0.0 - a0 %}
    {% endif %}
    {% if a1 >= 0 %}
        {% set abs1 = a1 %}
    {% else %}
        {% set abs1 = 0.0 - a1 %}
    {% endif %}

    {% if max_abs > 0 %}
        {% set peak = max_abs %}
    {% elif abs0 > abs1 %}
        {% set peak = abs0 %}
    {% else %}
        {% set peak = abs1 %}
    {% endif %}

    {% set sum_abs = abs0 + abs1 %}
    {% if sum_abs == 0 %}
        {% set balance = 0.0 %}
    {% elif abs0 > abs1 %}
        {% set balance = 1.0 - (abs0 - abs1) / sum_abs %}
    {% else %}
        {% set balance = 1.0 - (abs1 - abs0) / sum_abs %}
    {% endif %}

    {% if peak >= 20000 %}
        {% set snr_label = "strong signal" %}
        {% set snr_pts = 40 %}
    {% elif peak >= 5000 %}
        {% set snr_label = "good signal" %}
        {% set snr_pts = 34 %}
    {% elif peak >= 1000 %}
        {% set snr_label = "moderate signal" %}
        {% set snr_pts = 22 %}
    {% elif peak >= 300 %}
        {% set snr_label = "weak signal" %}
        {% set snr_pts = 12 %}
    {% else %}
        {% set snr_label = "very weak signal" %}
        {% set snr_pts = 5 %}
    {% endif %}

    {% set bracket_pts = (20.0 * balance)|int %}
    {% set clean = 0 %}
    {% if peak > 0 %}
        {% if abs0 < (0.02 * peak) %}
            {% if abs1 < (0.15 * peak) %}
                {% set clean = 1 %}
            {% endif %}
        {% endif %}
    {% endif %}

    {% set conf = 30 + snr_pts + bracket_pts %}
    {% if clean == 1 %}
        {% set conf = conf + 10 %}
    {% endif %}
    {% if peak < 300 %}
        {% if conf > 32 %}
            {% set conf = 32 %}
        {% endif %}
    {% elif peak < 1000 %}
        {% if conf > 44 %}
            {% set conf = 44 %}
        {% endif %}
    {% endif %}
    {% if conf < 0 %}
        {% set conf = 0 %}
    {% endif %}
    {% if conf > 100 %}
        {% set conf = 100 %}
    {% endif %}

    {% if conf >= 80 %}
        {% set grade = "excellent" %}
    {% elif conf >= 65 %}
        {% set grade = "good" %}
    {% elif conf >= 45 %}
        {% set grade = "fair" %}
    {% elif conf >= 30 %}
        {% set grade = "weak" %}
    {% else %}
        {% set grade = "unusable" %}
    {% endif %}

    {% if clean == 1 %}
        {% set clean_note = " | clean zero" %}
    {% else %}
        {% set clean_note = "" %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=last_k_star VALUE={k_out}

    {action_respond_info("========== APA FINISH: " ~ name ~ " ==========")}
    {action_respond_info("Bracket: k=" ~ k0 ~ " area=" ~ a0 ~ "  ->  k=" ~ k1 ~ " area=" ~ a1)}
    {action_respond_info("K* (zero cross): " ~ k_star ~ "  ->  rounded " ~ k_out)}
    {action_respond_info("Confidence: " ~ conf ~ "/100 (" ~ grade ~ ") | " ~ snr_label ~ " | bracket_balance=" ~ balance ~ clean_note)}
    {action_respond_info("Tip: pass MAX_ABS=largest abs area in the sweep for better signal grading")}
    {action_respond_info("--- copy/paste into Orca Adaptive PA ---")}
    {action_respond_info(k_out ~ ", " ~ flow ~ ", " ~ accel)}
    {action_respond_info("----------------------------------------")}
    {action_respond_info("Fallback hint: after all points, use median of K* (not min/max alone)")}
    {action_respond_info("  or center-point K* / stock FLOW_CALIBRATE as static PA")}
    {action_respond_info("========================================")}

[gcode_macro APA_FINISH_LAST]
description: Same as APA_FINISH_CELL but FLOW/ACCEL/NAME always from last test point. Only pass K0 A0 K1 A1 and optional MAX_ABS.
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {% if not c.pending_valid %}
        {action_raise_error("No pending test point - run a measure first")}
    {% endif %}
    APA_FINISH_CELL K0={params.K0} A0={params.A0} K1={params.K1} A1={params.A1} FLOW={c.pending_flow} ACCEL={c.pending_accel} NAME={c.pending_name} MAX_ABS={params.MAX_ABS|default(0)}

[gcode_macro APA_ORCA_LINE]
description: Print an Orca APA line from known K, FLOW, ACCEL
gcode:
    {% set k = params.K|float %}
    {% set flow = params.FLOW|float %}
    {% set accel = params.ACCEL|float %}
    {% set name = params.NAME|default("manual")|string %}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=last_k_star VALUE={k}
    {action_respond_info("APA [" ~ name ~ "] Orca line:")}
    {action_respond_info("--- copy/paste into Orca Adaptive PA ---")}
    {action_respond_info(k ~ ", " ~ flow ~ ", " ~ accel)}
    {action_respond_info("----------------------------------------")}

######################################################################
# Measure test points (split so banners run at correct times)
#   APA_COIL_CELL -> SET pending + BEGIN + MEASURE + END as separate cmds
######################################################################

[gcode_macro APA_COIL_CELL_BEGIN]
description: Internal - print START banner for pending test point
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {% set e_name = printer.toolhead.extruder %}
    {% set e_idx = printer[e_name].extruder_index %}
    {action_respond_info("========== APA TEST POINT START ==========")}
    {action_respond_info("Point: " ~ c.pending_name ~ " | Tool T" ~ e_idx ~ " (" ~ e_name ~ ") | MODE=" ~ c.pending_mode ~ " TEMP=" ~ c.temp)}
    {action_respond_info("XY: speed=" ~ c.pending_speed ~ " mm/s  accel=" ~ c.pending_accel ~ "  ->  Q=" ~ c.pending_flow ~ " mm3/s")}
    {action_respond_info("After k/area lines, find the sign flip, then either:")}
    {action_respond_info("  APA_FINISH_LAST K0=... A0=... K1=... A1=... MAX_ABS=...")}
    {action_respond_info("  (FLOW=" ~ c.pending_flow ~ " ACCEL=" ~ c.pending_accel ~ " NAME=" ~ c.pending_name ~ " filled automatically)")}
    {action_respond_info("==========================================")}

[gcode_macro APA_COIL_CELL_END]
description: Internal - print DONE banner after measure; copy-paste FINISH template with FLOW/ACCEL/NAME filled
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {action_respond_info("========== APA TEST POINT MEASURE DONE ==========")}
    {action_respond_info("Point " ~ c.pending_name ~ " finished. Find sign-flip in k/area lines ABOVE, then:")}
    {action_respond_info("  APA_FINISH_LAST K0= A0= K1= A1= MAX_ABS=")}
    {action_respond_info("If you already started the next point, use full form instead:")}
    {action_respond_info("  APA_FINISH_CELL K0= A0= K1= A1= FLOW=" ~ c.pending_flow ~ " ACCEL=" ~ c.pending_accel ~ " NAME=" ~ c.pending_name ~ " MAX_ABS=")}
    {action_respond_info("Orca row shape: PA, " ~ c.pending_flow ~ ", " ~ c.pending_accel)}
    {action_respond_info("=================================================")}

[gcode_macro APA_COIL_CELL]
description: One APA test point. SPEED/ACCEL are XY print values. Optional EXTRUDER=0..3
gcode:
    {% set cfg = printer["gcode_macro _APA_COIL_CFG"] %}
    {% set speed = params.SPEED|float %}
    {% set accel = params.ACCEL|float %}
    {% set mode  = params.MODE|default("MEASURE")|string|upper %}
    {% set temp  = params.TEMP|default(cfg.temp)|int %}
    {% set loop  = params.LOOP|default(cfg.loop)|int %}
    {% set k_min = params.MIN|default(cfg.k_min)|float %}
    {% set k_max = params.MAX|default(cfg.k_max)|float %}
    {% set k_step = params.STEP|default(cfg.k_step)|float %}
    {% set name  = params.NAME|default("point")|string %}

    {% set q  = speed * cfg.line_area %}
    {% set ve = speed * cfg.ratio %}
    {% set ae = (accel * cfg.ratio)|round(0)|int %}
    {% set slow_v  = ve * cfg.slow_frac %}
    {% set fast_v  = ve %}
    {% set start_v = (slow_v + fast_v) / 2.0 %}
    {% if start_v > 3.0 %}
        {% set start_d = start_v %}
    {% else %}
        {% set start_d = 3.0 %}
    {% endif %}
    {% if slow_v > 0.5 %}
        {% set slow_d = slow_v %}
    {% else %}
        {% set slow_d = 0.5 %}
    {% endif %}
    {% set fast_d_try = fast_v * 0.5 %}
    {% if fast_d_try > 0.8 %}
        {% set fast_d = fast_d_try %}
    {% else %}
        {% set fast_d = 0.8 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_valid VALUE=1
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_name VALUE="'{name}'"
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_flow VALUE={q}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_accel VALUE={accel}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_speed VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=pending_mode VALUE="'{mode}'"
    SET_GCODE_VARIABLE MACRO=_APA_COIL_CFG VARIABLE=temp VALUE={temp}

    {% if params.EXTRUDER is defined %}
        APA_SELECT_TOOL EXTRUDER={params.EXTRUDER|int}
    {% endif %}
    APA_COIL_CELL_BEGIN
    {% if mode == "CALIBRATE" %}
        FLOW_CALIBRATE FORCE=1 TEMP={temp} LOOP={loop} MIN={k_min} MAX={k_max} ALGORITHM=LINEAR_FITTING STARTV={start_v} STARTD={start_d} SLOWV={slow_v} SLOWD={slow_d} FASTV={fast_v} FASTD={fast_d} ACCEL={ae}
    {% else %}
        FLOW_MEASURE_K TEMP={temp} LOOP={loop} MIN={k_min} MAX={k_max} STEP={k_step} STARTV={start_v} STARTD={start_d} SLOWV={slow_v} SLOWD={slow_d} FASTV={fast_v} FASTD={fast_d} ACCEL={ae}
    {% endif %}
    APA_COIL_CELL_END

[gcode_macro APA_COIL_LOW_ANCHOR]
description: Test point - low speed x low accel (from envelope)
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    APA_COIL_CELL NAME=low_anchor SPEED={c.low_speed} ACCEL={c.low_accel} MODE={params.MODE|default("MEASURE")} TEMP={params.TEMP|default(c.temp)} EXTRUDER={params.EXTRUDER|default(0)} MIN={params.MIN|default(c.k_min)} MAX={params.MAX|default(c.k_max)} STEP={params.STEP|default(c.k_step)}

[gcode_macro APA_COIL_HIGH_FLOW]
description: Test point - high speed x low accel (from envelope)
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    APA_COIL_CELL NAME=high_flow SPEED={c.high_speed} ACCEL={c.low_accel} MODE={params.MODE|default("MEASURE")} TEMP={params.TEMP|default(c.temp)} EXTRUDER={params.EXTRUDER|default(0)} MIN={params.MIN|default(c.k_min)} MAX={params.MAX|default(c.k_max)} STEP={params.STEP|default(c.k_step)}

[gcode_macro APA_COIL_HIGH_FORCE]
description: Test point - low speed x high accel (from envelope)
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    APA_COIL_CELL NAME=high_force SPEED={c.low_speed} ACCEL={c.high_accel} MODE={params.MODE|default("MEASURE")} TEMP={params.TEMP|default(c.temp)} EXTRUDER={params.EXTRUDER|default(0)} MIN={params.MIN|default(c.k_min)} MAX={params.MAX|default(c.k_max)} STEP={params.STEP|default(c.k_step)}

[gcode_macro APA_COIL_STRESS]
description: Test point - high speed x high accel (from envelope)
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    APA_COIL_CELL NAME=stress SPEED={c.high_speed} ACCEL={c.high_accel} MODE={params.MODE|default("MEASURE")} TEMP={params.TEMP|default(c.temp)} EXTRUDER={params.EXTRUDER|default(0)} MIN={params.MIN|default(c.k_min)} MAX={params.MAX|default(c.k_max)} STEP={params.STEP|default(c.k_step)}

[gcode_macro APA_COIL_CENTER]
description: Test point - mid speed x mid accel (from envelope)
gcode:
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    APA_COIL_CELL NAME=center SPEED={c.mid_speed} ACCEL={c.mid_accel} MODE={params.MODE|default("MEASURE")} TEMP={params.TEMP|default(c.temp)} EXTRUDER={params.EXTRUDER|default(0)} MIN={params.MIN|default(c.k_min)} MAX={params.MAX|default(c.k_max)} STEP={params.STEP|default(c.k_step)}

[gcode_macro APA_COIL_SUITE_START]
description: Internal - suite start banner (runs after prior cmds so timing is correct)
gcode:
    {% set e = params.EXTRUDER|default(0)|int %}
    {% set mode = params.MODE|default("MEASURE")|string %}
    {% set temp = params.TEMP|default(printer["gcode_macro _APA_COIL_CFG"].temp)|int %}
    {% set c = printer["gcode_macro _APA_COIL_CFG"] %}
    {action_respond_info("=== APA COIL SUITE START ===")}
    {action_respond_info("Tool T" ~ e ~ "  MODE=" ~ mode ~ "  TEMP=" ~ temp)}
    {action_respond_info("Envelope v=" ~ c.low_speed ~ "-" ~ c.high_speed ~ " mm/s  a=" ~ c.low_accel ~ "-" ~ c.high_accel)}
    {action_respond_info("After each point: APA_FINISH_LAST K0= A0= K1= A1= MAX_ABS=")}
    {action_respond_info("Expect ~25 min and ~20 g filament for a full 5-point suite")}
    APA_COIL_SHOW_ENVELOPE

[gcode_macro APA_COIL_SUITE_END]
description: Internal - suite end banner
gcode:
    {action_respond_info("=== APA COIL SUITE DONE ===")}
    {action_respond_info("1) Finish each point: APA_FINISH_LAST or full APA_FINISH_CELL (see DONE banners)")}
    {action_respond_info("2) Paste all Orca lines into Adaptive PA measurements")}
    {action_respond_info("3) Fallback static PA: median of your K* values (sort, take middle row)")}
    {action_respond_info("   or center-point K*, or stock FLOW_CALIBRATE on this tool")}
    {action_respond_info("   Avoid using only the min or max K* as fallback")}

[gcode_macro APA_COIL_RUN_ALL]
description: 5-point suite on EXTRUDER=0..3 using current envelope
gcode:
    {% set e = params.EXTRUDER|default(0)|int %}
    {% set mode = params.MODE|default("MEASURE")|string %}
    {% set temp = params.TEMP|default(printer["gcode_macro _APA_COIL_CFG"].temp)|int %}
    {% set skip4 = params.SKIP_STRESS|default(0)|int %}

    APA_SELECT_TOOL EXTRUDER={e}
    APA_COIL_SUITE_START EXTRUDER={e} MODE={mode} TEMP={temp}

    APA_COIL_LOW_ANCHOR  MODE={mode} TEMP={temp} EXTRUDER={e}
    APA_COIL_HIGH_FLOW   MODE={mode} TEMP={temp} EXTRUDER={e}
    APA_COIL_HIGH_FORCE  MODE={mode} TEMP={temp} EXTRUDER={e}
    {% if skip4 == 0 %}
        APA_COIL_STRESS  MODE={mode} TEMP={temp} EXTRUDER={e}
    {% else %}
        APA_COIL_SKIP_STRESS_MSG
    {% endif %}
    APA_COIL_CENTER      MODE={mode} TEMP={temp} EXTRUDER={e}

    APA_COIL_SUITE_END

[gcode_macro APA_COIL_SKIP_STRESS_MSG]
description: Internal
gcode:
    {action_respond_info("APA: skipping STRESS (SKIP_STRESS=1)")}

[gcode_macro APA_COIL_RUN_ALL_TOOLS]
description: Suite on multiple tools TOOLS=0,1,2,3
gcode:
    {% set mode = params.MODE|default("MEASURE")|string %}
    {% set temp = params.TEMP|default(printer["gcode_macro _APA_COIL_CFG"].temp)|int %}
    {% set tools = params.TOOLS|default("0,1,2,3")|string %}
    {% for t in tools.split(",") %}
        APA_COIL_RUN_ALL EXTRUDER={t|trim|int} MODE={mode} TEMP={temp} SKIP_STRESS={params.SKIP_STRESS|default(0)}
    {% endfor %}

[gcode_macro APA_COIL_HELP]
description: Usage for Adaptive PA coil macros
gcode:
    {action_respond_info("APA coil workflow:")}
    {action_respond_info("  0. APA_COIL_SHOW_ENVELOPE")}
    {action_respond_info("  1. APA_COIL_RUN_ALL EXTRUDER=0 MODE=MEASURE TEMP=220")}
    {action_respond_info("  2. After each point k/area sign-flip:")}
    {action_respond_info("     APA_FINISH_LAST K0= A0= K1= A1= MAX_ABS=")}
    {action_respond_info("     (FLOW/ACCEL/NAME auto from last point)")}
    {action_respond_info("  3. Paste Orca lines into Adaptive PA measurements")}
    {action_respond_info("  4. Fallback static PA = median of K* (or center / FLOW_CALIBRATE)")}
    {action_respond_info("Presets: U1_DEFAULT | ORCA_NORMAL | SHAPER_QUALITY | HIGH_FLOW")}
    APA_COIL_SHOW_ENVELOPE
